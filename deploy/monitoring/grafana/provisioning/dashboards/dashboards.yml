apiVersion: 1

providers:
  - name: starter
    orgId: 1
    folder: Starter
    type: file
    # Dashboards are files in the repo, not clicked together in the UI: a
    # dashboard that only exists in Grafana's database is lost with the volume and
    # cannot be reviewed in a diff.
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
