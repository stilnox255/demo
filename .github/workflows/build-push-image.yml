name: Build & Push Image

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Full image path under the registry, e.g. ingoschindler/starter-backend'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile, relative to repo root'
        required: true
        type: string
      context:
        description: 'Docker build context, relative to repo root'
        required: true
        type: string
      registry:
        description: 'Registry host to log in to and push to'
        required: false
        type: string
        default: 'registry.ingoschindler.de'
      tag-suffix:
        description: 'Prefix inserted before both tags, e.g. "jvm-" (empty for none)'
        required: false
        type: string
        default: ''
      artifact-name:
        description: 'Workflow artifact to download into artifact-path before building (empty to skip)'
        required: false
        type: string
        default: ''
      artifact-path:
        description: 'Directory to download artifact-name into'
        required: false
        type: string
        default: ''
    secrets:
      registry-user:
        required: true
      registry-token:
        required: true

jobs:
  build-push:
    name: ${{ inputs.image-name }}
    runs-on: ubuntu-latest
    # actions:read is required for actions/download-artifact@v8 — the caller
    # workflow's `permissions: contents: read` doesn't propagate this scope
    # to a called reusable workflow, so it must be declared here explicitly.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image tag
        id: tag
        run: echo "value=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-user }}
          password: ${{ secrets.registry-token }}
      - name: Download build artifact
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: Build & push
        env:
          REGISTRY_IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
          TAG: ${{ inputs.tag-suffix }}${{ steps.tag.outputs.value }}
          LATEST: ${{ inputs.tag-suffix }}latest
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          docker build -f "$DOCKERFILE" -t "$REGISTRY_IMAGE:$TAG" -t "$REGISTRY_IMAGE:$LATEST" "$CONTEXT"
          docker push "$REGISTRY_IMAGE:$TAG"
          docker push "$REGISTRY_IMAGE:$LATEST"
