# =============================================================================
# Application configuration.
#
# Values are chosen, not inherited. Anything with a comment above it has a
# reason that cost someone an incident; anything without one is a framework
# default we are content with. Configuration is supplied exclusively through
# environment variables in deployed environments (ADR-24), so every key that
# differs per environment reads ${SOME_VAR:default} rather than a literal.
# =============================================================================

# --- Application identity ----------------------------------------------------
# Base URL used to build absolute links in API responses (ADR-12). Derived from
# configuration and never from the request: behind a reverse proxy the container
# only sees its own bind address.
starter.api.base-url=${STARTER_API_BASE_URL:http://localhost:8080}

# --- HTTP --------------------------------------------------------------------
# Caps the whole request body, which for a multipart upload means all parts
# combined. Quarkus REST has no per-file multipart limit, so this is the only
# size guard available — an unbounded body is an unbounded heap.
quarkus.http.limits.max-body-size=100M
quarkus.http.body.uploads-directory=${java.io.tmpdir}/quarkus-uploads
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.body.handle-file-uploads=true

%dev.quarkus.http.host=0.0.0.0
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/http:\/\/localhost:.*/,/http:\/\/127\.0\.0\.1:.*/,/http:\/\/192\.168\..*\..*:.*/
%dev.quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
%dev.quarkus.http.cors.exposed-headers=*
%dev.quarkus.http.cors.access-control-allow-credentials=true

# --- Security ----------------------------------------------------------------
# JWT validation only, no introspection round trip per request.
quarkus.oidc.client-id=frontend-client
quarkus.oidc.application-type=service
quarkus.oidc.token.verify-access-token-with-user-info=false
quarkus.oidc.authentication.user-info-required=false
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
# Dev accepts tokens from localhost and from a LAN IP, which are different
# issuers to Keycloak even when they are the same server.
%dev.quarkus.oidc.token.issuer=any

# Endpoints are open by default and locked down per resource with @RolesAllowed.
# The inverse — deny-all here plus an allow list of paths — puts the access rules
# in two places that then disagree.
quarkus.http.auth.permission.permit-all.paths=/*
quarkus.http.auth.permission.permit-all.policy=permit

%prod.quarkus.oidc.token.forced-jwk-refresh-interval=PT10M
%prod.quarkus.oidc.roles.source=accesstoken
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}
%prod.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}

# HMAC secret for signed download tokens (ADR-19). No %prod default on purpose:
# a deployment that forgets it must fail at startup, not mint tokens anyone can
# forge.
starter.download.token.secret=${DOWNLOAD_TOKEN_SECRET}
starter.download.token.ttl-seconds=300
%dev.starter.download.token.secret=dev-download-secret-CHANGE-ME
%test.starter.download.token.secret=test-download-secret-CHANGE-ME

# --- API documentation -------------------------------------------------------
quarkus.smallrye-openapi.info-title=Starter API
quarkus.smallrye-openapi.info-description=Reference backend for the standard technology stack
quarkus.smallrye-openapi.management.enabled=false
quarkus.smallrye-openapi.path=/openapi

# --- Health and observability ------------------------------------------------
quarkus.smallrye-health.root-path=health

quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true
# Agroal pool metrics need both toggles: the first registers with Micrometer,
# the second enables the JDBC-specific binder. Without them the pool-saturation
# panels stay empty, which is the one number worth having during an incident.
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.enable-metrics=true
# Surfaces query and fetch counts, and logs anything above the threshold at WARN
# so an N+1 shows up in the log instead of only in a profiler.
quarkus.hibernate-orm.metrics.enabled=true
quarkus.hibernate-orm.log.queries-slower-than-ms=250

# Metrics and health on a separate port so they can be reached from inside the
# network without being exposed through the public router.
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.host=0.0.0.0
%dev.quarkus.management.enabled=false

quarkus.otel.propagators=tracecontext,baggage
%dev.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.exporter=none

# --- Logging -----------------------------------------------------------------
# Console stays plain text everywhere: `docker compose logs` has to be readable
# by eye. Structured output goes to the log pipeline instead (see below).
quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [userId=%X{userId} traceId=%X{traceId} spanId=%X{spanId}] (%t) %s%e%n

%dev.quarkus.log.level=${LOG_LEVEL:INFO}
%dev.quarkus.log.category."de.ingoschindler".level=DEBUG
%prod.quarkus.log.level=${LOG_LEVEL:INFO}
%prod.quarkus.log.category."root".level=WARN
%prod.quarkus.log.category."de.ingoschindler".level=INFO

# JSON over syslog to the log collector. UDP, not TCP: log shipping must never
# apply backpressure to the application if the collector is briefly down —
# best-effort delivery is the right trade here, not a blocked request thread.
%prod.quarkus.log.syslog.enabled=true
%prod.quarkus.log.syslog.endpoint=${LOG_COLLECTOR_ENDPOINT:alloy:5140}
%prod.quarkus.log.syslog.protocol=udp
%prod.quarkus.log.syslog.app-name=starter-backend
%prod.quarkus.log.syslog.json.enabled=true
%prod.quarkus.log.syslog.json.exception-output-type=detailed
%prod.quarkus.log.syslog.json.print-details=true

# --- Database ----------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# Pool sized rather than left at the default: pool_size = threads x (connections
# per thread - 1) + 1. Two connections per thread, because a use case may call a
# REQUIRES_NEW step that suspends its caller's transaction while it runs.
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
# Fail fast instead of queueing forever. A saturated pool is an overload signal,
# and a request that waited 30 seconds for a connection has already lost its
# caller.
quarkus.datasource.jdbc.acquisition-timeout=5S

# Without a batch size every bulk write degrades to one round trip per row.
quarkus.hibernate-orm.jdbc.statement-batch-size=50
# order_inserts groups same-table INSERTs so the batch above can actually fill.
# Quarkus has no first-class key for it, so it goes through
# unsupported-properties and logs a "sets unsupported properties" warning on
# boot — that warning is expected here, not a misconfiguration.
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true
# Safety net for lazy associations touched in a loop: one WHERE id IN (...) per
# batch instead of one SELECT per row.
quarkus.hibernate-orm.fetch.batch-size=32

quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-at-start=false

# --- Caching (ADR-41) --------------------------------------------------------
# Redis, stated explicitly. The redis-cache extension already makes `redis` the
# default the moment it is on the classpath, which is a default worth writing down
# rather than inheriting — reading `quarkus.cache.type` should not require knowing
# which extensions are present.
quarkus.cache.type=redis
# The suite runs the in-process backend instead: no container to start, and every
# test class would otherwise pay for one it does not use.
%test.quarkus.cache.type=caffeine
# Off in tests beyond that: a cached snapshot outlives the case that wrote it
# inside one QuarkusTest process, so the next one reads its predecessor's answer.
# Cases that cover the cache itself switch it back on through their own profile.
%test.quarkus.cache.enabled=false
# Redis is a cache, so it is deliberately absent from readiness: a degraded cache
# still serves correct answers from the database (see DemoItemSummariesCache),
# and taking the instance out of rotation for it would turn a slowdown into an
# outage.
quarkus.redis.health.enabled=false

# --- Object storage ----------------------------------------------------------
s3.bucket.files=${S3_BUCKET_FILES:files}
quarkus.s3.aws.region=us-east-1
# Required by most S3-compatible servers, which do not do virtual-host buckets.
quarkus.s3.path-style-access=true
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:dev-access-key}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:dev-secret-key}
# Scoped to %dev and %prod, never unscoped: an explicit endpoint override always beats
# Dev Services, so setting it for every profile would silently disable the S3 emulator
# that %test relies on.
#
# The dev default is localhost, not the compose service name: dev mode runs the
# application on the host, and only the published port is reachable from there.
# `http://rustfs:9000` is what a containerised caller on the same compose network would
# use.
%dev.quarkus.s3.endpoint-override=${S3_ENDPOINT_OVERRIDE:http://localhost:9000}
%prod.quarkus.s3.endpoint-override=${S3_ENDPOINT_OVERRIDE}

# Transport timeouts, chosen per dependency. connection-timeout is the TCP
# connect: if the store has not answered in 3s it is down, not slow, and waiting
# longer only holds a request thread. socket-timeout is per-read idle time, not
# total transfer time, so 60s detects a stalled transfer without capping how long
# a large upload may legitimately take.
quarkus.s3.sync-client.connection-timeout=3S
quarkus.s3.sync-client.socket-timeout=60S
# Deliberately no quarkus.s3.api-call-timeout: that budget covers the whole call
# including the body, so it would have to be sized for the largest upload and
# would then be far too loose to protect the small metadata calls sharing this
# client. Total call length is bounded by the caller instead.

# --- Fault tolerance (ADR-20) ------------------------------------------------
# Values live in configuration, not in annotation literals, so a timeout can be
# retuned in an incident without a rebuild. Keys are
# <fqcn>/<method>/<Annotation>/<parameter>.
#
# putBlob gets a timeout but no retry: its InputStream has already been consumed
# when the call fails, so a second attempt would upload a truncated body. Retry
# is only safe where the operation is repeatable, which for uploads it is not.
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/putBlob/Timeout/value=70000
# download and delete are idempotent, so a bounded retry with jitter is safe.
# Jitter matters: without it every client that failed at the same moment retries
# at the same moment.
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/download/Timeout/value=65000
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/download/Retry/maxRetries=2
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/download/Retry/delay=200
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/download/Retry/jitter=100
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/delete/Timeout/value=10000
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/delete/Retry/maxRetries=2
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/delete/Retry/delay=200
de.ingoschindler.kernel.storage.adapter.out.s3.ObjectStorageAdapter/delete/Retry/jitter=100
# Bounds one archive run. Generous, because the batch is small and the point is
# to stop a run that has stopped making progress, not to race a healthy one.
de.ingoschindler.demo.application.usecase.ArchiveStaleDemoItemsService/archiveStale/Timeout/value=30000

# --- Demo aggregate ----------------------------------------------------------
starter.demo.archive.after=P30D
starter.demo.archive.batch-size=200
# Off-boundary on purpose: everything scheduled at 0 0 * * * across a fleet hits
# the database in the same second.
starter.demo.archive.cron=17 7 3 * * ?
%test.starter.demo.archive.cron=off

# --- Container image ---------------------------------------------------------
quarkus.container-image.group=ingoschindler
quarkus.container-image.name=starter-backend
quarkus.container-image.registry=${CONTAINER_REGISTRY:registry.ingoschindler.de}
quarkus.container-image.tag=${IMAGE_TAG:latest}
quarkus.container-image.builder=jib
# Non-root, matching the UID the deployment's secret files are readable by.
quarkus.jib.user=1001:1001
%prod.quarkus.container-image.build=false

# --- Dev Services ------------------------------------------------------------
%dev.quarkus.devservices.enabled=true
%dev.quarkus.datasource.devservices.port=5432
%dev.quarkus.datasource.devservices.enabled=true

# Quarkus discovers compose-devservices.yml and starts it as part of dev mode, so
# `./gradlew quarkusDev` is the single command that brings up everything: the services
# it provisions itself (database, identity provider) plus the persistent object store
# and the dev reverse proxy from that file.
#
# One thing to know about it: the compose start is all-or-nothing. The dev proxy
# publishes :80, and if that port is taken the bind fails, the whole compose start
# aborts, and dev mode never boots — with the actual cause several stack traces down.
# Set DEV_PROXY_PORT in .env to move it.
%dev.quarkus.compose.devservices.project-name=starter

%dev.quarkus.keycloak.devservices.port=8180
%dev.quarkus.keycloak.devservices.realm-name=starter
%dev.quarkus.keycloak.devservices.realm-path=realm_configuration-dev.json
%dev.quarkus.keycloak.devservices.create-realm=true
%dev.quarkus.keycloak.devservices.web-client-timeout=60

# S3 emulator for %dev and %test. Floci rather than LocalStack: a ~150MB image
# with a native boot against LocalStack's ~1GB Python image, and that cost is
# paid on every Dev Services spin-up.
quarkus.aws.devservices.provider=floci
quarkus.aws.devservices.floci.image-name=floci/floci:1.6.0

# --- Native image ------------------------------------------------------------
%native.quarkus.package.jar.enabled=false
%native.quarkus.native.enabled=true
%native.quarkus.native.container-build=true
%native.quarkus.native.additional-build-args=-march=compatibility,--initialize-at-build-time=org.postgresql.Driver
