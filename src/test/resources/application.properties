%test.quarkus.management.enabled=false
%test.quarkus.compose.devservices.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
# No Redis container for the suite: %test runs the in-process cache backend, and
# the redis-cache extension would otherwise spin up a Dev Service that every test
# class pays for and none of them uses.
%test.quarkus.redis.devservices.enabled=false
# @Scheduled jobs fire immediately on every Quarkus test-context boot, not only on
# their configured period (SimpleScheduler treats the first evaluation as an
# immediate fire). Quarkus reuses one application context and one database across
# @QuarkusTest classes, so that fire runs against whatever another test class left
# in the table and races its assertions. Tests that need a job's behaviour inject
# the bean and invoke it directly, so disabling the schedule here costs nothing.
%test.quarkus.scheduler.enabled=false
quarkus.jacoco.report=false
quarkus.jacoco.data-file=build/jacoco/quarkus.exec
%test.starter.api.base-url=http://test-host:8080
