# Dev reverse proxy. The browser talks to http://localhost/ and this splits it:
#   /api/, /q/, /.well-known/  -> Quarkus on the host, port 8080
#   everything else            -> Vite dev server on the host, port 5173
#
# One origin in development, like in production. Two origins would mean CORS and
# cookie behaviour that only exists locally, which is exactly the class of problem
# that then appears for the first time after a deploy.
server {
    listen 80;
    server_name _;

    # nginx defaults to 1m, which silently truncates an upload long before the
    # application's own limit applies.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://host.docker.internal:8080;
    }

    location /.well-known/ {
        proxy_pass http://host.docker.internal:8080;
    }

    # The Quarkus Dev UI pushes live-reload updates over SSE, which needs
    # buffering off and a long read timeout.
    #
    # The proxy_set_header lines are repeated on purpose: nginx replaces, rather
    # than merges, inherited headers as soon as any proxy_set_header appears in a
    # nested scope. Leaving them out here silently drops all four.
    location /q/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    # Vite, including the HMR WebSocket.
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
